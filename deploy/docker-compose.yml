services:
  bridge:
    build:
      context: ..
      dockerfile: bridge/Dockerfile
    restart: unless-stopped
    env_file:
      - ${BRIDGE_ENV_FILE:-/etc/libre-desk/bridge.env}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ../firmware-releases:/srv/firmware:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      LIBRE_HOST: ${LIBRE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../tools/flasher:/srv/flasher:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data: {}
  caddy_config: {}
